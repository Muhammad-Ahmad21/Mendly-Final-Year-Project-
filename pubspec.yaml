name: mendly_1
description: A wellness and mindfulness app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.1.0
  shared_preferences: ^2.3.2
  provider: ^6.1.2
  url_launcher: ^6.3.0
  flutter_staggered_animations: ^1.1.1
  video_player: ^2.8.1
  chewie: ^1.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: SF Pro Text
      fonts:
        - asset: assets/fonts/SFPRODISPLAYREGULAR.otf
          weight: 400
        - asset: assets/fonts/SFPRODISPLAYMEDIUM.otf
          weight: 500
        - asset: assets/fonts/SFPRODISPLAYSEMIBOLDITALIC.otf
          weight: 600
        - asset: assets/fonts/SFPRODISPLAYBOLD.otf
          weight: 700

  assets:
    - assets/images/

